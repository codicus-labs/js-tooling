name: Publish

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: voidzero-dev/setup-vp@v1.21.2
              with:
                  node-version-file: .node-version
                  cache: true
            - run: vp run build
            - run: vp run check
            - run: pnpm -r publish --access public --provenance --no-git-checks --registry=https://registry.npmjs.org/
