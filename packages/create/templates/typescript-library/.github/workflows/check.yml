name: Check

on: [push, pull_request]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: voidzero-dev/setup-vp@v1.21.2
              with:
                  node-version-file: .node-version
                  cache: true
            - run: vp run build
            - run: vp run check
